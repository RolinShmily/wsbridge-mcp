name: Feature Request
description: Suggest a focused improvement within wsbridge's security model
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What problem does this solve and why does it fit wsbridge?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Security & Dependency Notes
      description: Does this require any new external dependencies or changes to sandbox boundaries?
